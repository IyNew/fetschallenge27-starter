# Copy this file per winning architecture and set base_config plus the three
# chosen hyperparameters from the screening ranking. It trains three fixed seeds.
name: confirmation
base_config: configs/models/resnet50_groupnorm.yaml
run_output_dir: outputs
output_dir: outputs/sweeps/confirmation
grid:
  training.seed: [17, 29, 43]
  training.epochs: [80]
  training.early_stopping_patience: [15]
  training.learning_rate: [0.0001]
  training.weight_decay: [0.00001]
